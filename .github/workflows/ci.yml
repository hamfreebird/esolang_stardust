name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --verbose
      - run: cargo test --verbose -- --skip codegen_tests::compile_toolchain_check
      - run: cargo clippy --all-targets -- -D errors
      - run: cargo fmt --all -- --check

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd stardust-vscode && npm ci && npm run compile
